    // a click (not a drag) on empty space clears the BOM part selection;
    // clicks on nodes or edges leave it alone
    var onElement = event.target.closest && event.target.closest("g.node, g.edge");
    if (pan && !pan.moved && !onElement) clearPartFocus();
    pan = null;
    viewport.classList.remove("wv-panning");
  });
  viewport.addEventListener("dblclick", fit);
  window.addEventListener("resize", fit);
  fit();

  /* ---------- printing ----------
     CSS can't unset an inline-style transform, so clear it here and let the
     diagram flow at natural size; restore the interactive fit afterwards. */

  window.addEventListener("beforeprint", function () {
    svg.style.transform = "none";
    svg.style.maxWidth = "100%";
    svg.style.height = "auto";
  });
  window.addEventListener("afterprint", function () {
    svg.style.maxWidth = "";
    svg.style.height = "";
    fit();
  });

  /* ---------- net tracing ----------

     Each wire edge carries wv-net-* class tokens emitted by the generator:
     one for its cable wire, one for the connector pin it lands on. Edges
     sharing a token belong to the same electrical net (through splices and
     daisy-chains), discovered here with a union-find over the tokens.     */

  var parent = {};
  function find(token) {
    while (parent[token] !== token) {
      parent[token] = parent[parent[token]];
      token = parent[token];
    }
    return token;
  }
  function union(a, b) {
    if (!(a in parent)) parent[a] = a;
    if (!(b in parent)) parent[b] = b;
    parent[find(a)] = find(b);
  }

  function netTokens(el) {
    return Array.prototype.filter.call(el.classList, function (c) {
      return c.indexOf("wv-net-") === 0;
    });
  }

  var wires = Array.prototype.filter.call(
    svg.querySelectorAll("g.edge"),
    function (el) { return el.classList.contains("wv-wire"); }
  );
  wires.forEach(function (el) {
    var tokens = netTokens(el);
    tokens.forEach(function (token) { union(tokens[0], token); });
  });

  // net root -> member edges, built once so hover lookups are O(1)
  var nets = {};
  wires.forEach(function (el) {
    var tokens = netTokens(el);
    if (!tokens.length) return;
    var root = find(tokens[0]);
    (nets[root] = nets[root] || []).push(el);
  });

  function netOf(el) {
    var tokens = netTokens(el);
    if (!tokens.length) return [el];
    return nets[find(tokens[0])] || [el];
  }

  wires.forEach(function (el) {
    // widen the hover target: an invisible fat stroke along the middle of
    // the wire's parallel colour paths, so the pointer needn't hit a 2pt line
    var paths = el.querySelectorAll("path");
    if (paths.length) {
      var mid = paths[Math.floor(paths.length / 2)];
      var hit = document.createElementNS("http://www.w3.org/2000/svg", "path");
      hit.setAttribute("d", mid.getAttribute("d"));
      hit.setAttribute("class", "wv-hit");
      el.appendChild(hit);
    }
    el.style.cursor = "pointer";
    el.addEventListener("mouseenter", function () {
      netOf(el).forEach(function (member) { member.classList.add("wv-hl"); });
      svg.classList.add("wv-focus-net");
    });
    el.addEventListener("mouseleave", function () {
      svg.classList.remove("wv-focus-net");
      wires.forEach(function (member) { member.classList.remove("wv-hl"); });
    });
  });

  /* ---------- BOM to diagram linkage ---------- */

  function cssToken(name) {
    return name.replace(/[^A-Za-z0-9_-]/g, "_");
  }

  var nodes = Array.prototype.slice.call(svg.querySelectorAll("g.node"));

  function nodesFor(designators) {
    var result = [];
    designators.forEach(function (name) {
      var cls = "wv-dsg-" + cssToken(name);
      nodes.forEach(function (node) {
        if (node.classList.contains(cls)) result.push(node);
      });
    });
    return result;
  }

  var selectedRow = null;

  function clearPartFocus() {
    svg.classList.remove("wv-focus-part");
    nodes.forEach(function (node) { node.classList.remove("wv-hl"); });
    if (selectedRow) selectedRow.classList.remove("wv-selected");
    selectedRow = null;
  }

  function centerOn(el) {
    var rect = el.getBoundingClientRect();
    var view = viewport.getBoundingClientRect();
    tx += (view.left + view.width / 2) - (rect.left + rect.width / 2);
    ty += (view.top + view.height / 2) - (rect.top + rect.height / 2);
    apply();
  }

  Array.prototype.forEach.call(
    document.querySelectorAll("#bom tr"),
    function (row) {
      var cell = row.querySelector("td.bom_col_designators");
      if (!cell || !cell.textContent.trim()) return;
      var designators = cell.textContent.trim().split(/[,\s]+/);
      if (!nodesFor(designators).length) return;
      row.setAttribute("data-wv-linked", "");
      row.addEventListener("click", function () {
        var wasSelected = selectedRow === row;
        clearPartFocus();
        if (wasSelected) return;
        var members = nodesFor(designators);
        members.forEach(function (node) { node.classList.add("wv-hl"); });
        svg.classList.add("wv-focus-part");
        row.classList.add("wv-selected");
        selectedRow = row;
        centerOn(members[0]);
      });
    }
  );

  document.addEventListener("keydown", function (event) {
    if (event.key === "Escape") clearPartFocus();
  });
})();
</script>

</body></html>
