name: Create Examples

# push is limited to master so a PR branch builds once, not once per event
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      max-parallel: 6
      matrix:
        # ubuntu-22.04 supports Python 3.7-3.12
        # ubuntu-24.04 (currently latest & preferred) supports Python 3.9-3.12
        # More details: https://github.com/actions/runner-images/issues/10636
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]
        include:
          - os: ubuntu-22.04
            python-version: "3.7"
          - os: ubuntu-22.04
            python-version: "3.8"
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    # installed via apt because ts-graphviz/setup-graphviz has no Node 24 build
    - name: Setup Graphviz
      run: sudo apt-get update && sudo apt-get install -y graphviz
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .
    - name: Create Examples
      run: PYTHONPATH=$(pwd)/src/wireviz:$PYTHONPATH cd src/wireviz/ && python build_examples.py
    - name: Upload examples, demos, and tutorials
      uses: actions/upload-artifact@v7
      with:
        name: examples-and-tutorials-v${{ matrix.python-version }}
        path: |
          examples/
          tutorial/
        if-no-files-found: error
        
