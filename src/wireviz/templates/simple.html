<!DOCTYPE html>
<html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="generator" content="<!-- %generator% -->">
  <title><!-- %title% --></title>
  <style>

    #bom table, th, td {
      border: 1px solid black;
      border-collapse: collapse;
    }

    #bom th, td {
      padding: 4px;
      text-align: left;
    }

    .bom_col_qty {
      text-align: right;
    }

    #bom tr.wv-selected td {
      background-color: #fde68a;
    }

    #bom tr[data-wv-linked] {
      cursor: pointer;
    }

    #diagram {
      overflow: hidden;
      border: 1px solid #999;
      height: 75vh;
      position: relative;
      cursor: grab;
      touch-action: none;
    }

    #diagram.wv-panning {
      cursor: grabbing;
    }

    #diagram svg {
      display: block;
      transform-origin: 0 0;
    }

    #diagram svg g.edge,
    #diagram svg g.node {
      transition: opacity .12s;
    }

    /* A hovered net keeps its wires at full strength; other edges recede. */
    #diagram svg.wv-focus-net g.edge:not(.wv-hl) {
      opacity: .12;
    }

    /* A part selected from the BOM keeps its node; the rest recedes. */
    #diagram svg.wv-focus-part g.node:not(.wv-hl) {
      opacity: .25;
    }

    #diagram svg.wv-focus-part g.edge {
      opacity: .12;
    }

    #diagram svg path.wv-hit {
      fill: none;
      stroke: #000;
      stroke-opacity: 0;
      stroke-width: 14px;
      pointer-events: stroke;
    }

    #wv-hint {
      position: absolute;
      right: 8px;
      bottom: 8px;
      font-size: 12px;
      color: #555;
      background: rgba(255, 255, 255, .8);
      padding: 2px 6px;
      border-radius: 3px;
      pointer-events: none;
    }

    /* The SVG interior follows the YAML bgcolor option, so only the page
       chrome is themed here; #diagram keeps a light background so the
       fixed-light diagram stays readable on the dark page. */
    @media (prefers-color-scheme: dark) {
      body {
        background-color: #1a1a1a !important;
        color: #ddd;
      }

      #diagram {
        border-color: #555;
        background-color: #ffffff;
      }

      #bom table, #bom th, #bom td {
        border-color: #555;
      }

      #bom table {
        background-color: #242424;
        color: #ddd;
      }

      #bom tr.wv-selected td {
        background-color: #78560b;
      }

      #wv-hint {
        color: #bbb;
        background: rgba(32, 32, 32, .8);
      }
    }

    @media print {
      #diagram {
        height: auto;
        overflow: visible;
        border: none;
      }

      #wv-hint {
        display: none;
      }

      #bom {
        break-before: page;
      }

      tr {
        break-inside: avoid;
      }
    }

  </style>
</head><body style="font-family:<!-- %fontname% -->;background-color:<!-- %bgcolor% -->">
<h1><!-- %title% --></h1>
<h2>Diagram</h2>

<div id="description">
  <!-- %description% -->
</div>

<div id="diagram">
  <!-- %diagram% -->
</div>

<div id="notes">
  <!-- %notes% -->
</div>

<h2>Bill of Materials</h2>

<div id="bom">
  <!-- %bom% -->
</div>

<script>
(function () {
  "use strict";

  var viewport = document.getElementById("diagram");
  var svg = viewport ? viewport.querySelector("svg") : null;
  if (!svg) return;

  var hint = document.createElement("div");
  hint.id = "wv-hint";
  hint.textContent = "scroll: zoom · drag: pan · double-click: fit · hover a wire: trace its net";
  viewport.appendChild(hint);

  /* ---------- pan / zoom ---------- */

  var natural = svg.getBoundingClientRect();
  var naturalWidth = natural.width || 1;
  var naturalHeight = natural.height || 1;
  var scale = 1, tx = 0, ty = 0;

  function apply() {
    svg.style.transform =
      "translate(" + tx + "px," + ty + "px) scale(" + scale + ")";
  }

  function fit() {
    var vw = viewport.clientWidth, vh = viewport.clientHeight;
    scale = Math.min(vw / naturalWidth, vh / naturalHeight, 1.5);
    tx = (vw - naturalWidth * scale) / 2;
    ty = (vh - naturalHeight * scale) / 2;
    apply();
  }

  viewport.addEventListener("wheel", function (event) {
    event.preventDefault();
    var rect = viewport.getBoundingClientRect();
    var mx = event.clientX - rect.left, my = event.clientY - rect.top;
    var factor = Math.exp(-event.deltaY * 0.0015);
    var next = Math.min(Math.max(scale * factor, 0.02), 40);
    factor = next / scale;
    tx = mx - (mx - tx) * factor;
    ty = my - (my - ty) * factor;
    scale = next;
    apply();
  }, { passive: false });

  var pan = null;
  viewport.addEventListener("pointerdown", function (event) {
    if (event.button !== 0) return;
    pan = { x: event.clientX, y: event.clientY, moved: false };
    viewport.classList.add("wv-panning");
    try { viewport.setPointerCapture(event.pointerId); } catch (ignored) {}
  });
  viewport.addEventListener("pointermove", function (event) {
    if (!pan) return;
    var dx = event.clientX - pan.x, dy = event.clientY - pan.y;
    if (Math.abs(dx) + Math.abs(dy) > 3) pan.moved = true;
    tx += dx; ty += dy;
    pan.x = event.clientX; pan.y = event.clientY;
    apply();
  });
  viewport.addEventListener("pointerup", function (event) {
    // a click (not a drag) on empty space clears the BOM part selection;
    // clicks on nodes or edges leave it alone
    var onElement = event.target.closest && event.target.closest("g.node, g.edge");
    if (pan && !pan.moved && !onElement) clearPartFocus();
    pan = null;
    viewport.classList.remove("wv-panning");
  });
  viewport.addEventListener("dblclick", fit);
  window.addEventListener("resize", fit);
  fit();

  /* ---------- printing ----------
     CSS can't unset an inline-style transform, so clear it here and let the
     diagram flow at natural size; restore the interactive fit afterwards. */

  window.addEventListener("beforeprint", function () {
    svg.style.transform = "none";
    svg.style.maxWidth = "100%";
    svg.style.height = "auto";
  });
  window.addEventListener("afterprint", function () {
    svg.style.maxWidth = "";
    svg.style.height = "";
    fit();
  });

  /* ---------- net tracing ----------

     Each wire edge carries wv-net-* class tokens emitted by the generator:
     one for its cable wire, one for the connector pin it lands on. Edges
     sharing a token belong to the same electrical net (through splices and
     daisy-chains), discovered here with a union-find over the tokens.     */

  var parent = {};
  function find(token) {
    while (parent[token] !== token) {
      parent[token] = parent[parent[token]];
      token = parent[token];
    }
    return token;
  }
  function union(a, b) {
    if (!(a in parent)) parent[a] = a;
    if (!(b in parent)) parent[b] = b;
    parent[find(a)] = find(b);
  }

  function netTokens(el) {
    return Array.prototype.filter.call(el.classList, function (c) {
      return c.indexOf("wv-net-") === 0;
    });
  }

  var wires = Array.prototype.filter.call(
    svg.querySelectorAll("g.edge"),
    function (el) { return el.classList.contains("wv-wire"); }
  );
  wires.forEach(function (el) {
    var tokens = netTokens(el);
    tokens.forEach(function (token) { union(tokens[0], token); });
  });

  // net root -> member edges, built once so hover lookups are O(1)
  var nets = {};
  wires.forEach(function (el) {
    var tokens = netTokens(el);
    if (!tokens.length) return;
    var root = find(tokens[0]);
    (nets[root] = nets[root] || []).push(el);
  });

  function netOf(el) {
    var tokens = netTokens(el);
    if (!tokens.length) return [el];
    return nets[find(tokens[0])] || [el];
  }

  wires.forEach(function (el) {
    // widen the hover target: an invisible fat stroke along the middle of
    // the wire's parallel colour paths, so the pointer needn't hit a 2pt line
    var paths = el.querySelectorAll("path");
    if (paths.length) {
      var mid = paths[Math.floor(paths.length / 2)];
      var hit = document.createElementNS("http://www.w3.org/2000/svg", "path");
      hit.setAttribute("d", mid.getAttribute("d"));
      hit.setAttribute("class", "wv-hit");
      el.appendChild(hit);
    }
    el.style.cursor = "pointer";
    el.addEventListener("mouseenter", function () {
      netOf(el).forEach(function (member) { member.classList.add("wv-hl"); });
      svg.classList.add("wv-focus-net");
    });
    el.addEventListener("mouseleave", function () {
      svg.classList.remove("wv-focus-net");
      wires.forEach(function (member) { member.classList.remove("wv-hl"); });
    });
  });

  /* ---------- BOM to diagram linkage ---------- */

  function cssToken(name) {
    return name.replace(/[^A-Za-z0-9_-]/g, "_");
  }

  var nodes = Array.prototype.slice.call(svg.querySelectorAll("g.node"));

  function nodesFor(designators) {
    var result = [];
    designators.forEach(function (name) {
      var cls = "wv-dsg-" + cssToken(name);
      nodes.forEach(function (node) {
        if (node.classList.contains(cls)) result.push(node);
      });
    });
    return result;
  }

  var selectedRow = null;

  function clearPartFocus() {
    svg.classList.remove("wv-focus-part");
    nodes.forEach(function (node) { node.classList.remove("wv-hl"); });
    if (selectedRow) selectedRow.classList.remove("wv-selected");
    selectedRow = null;
  }

  function centerOn(el) {
    var rect = el.getBoundingClientRect();
    var view = viewport.getBoundingClientRect();
    tx += (view.left + view.width / 2) - (rect.left + rect.width / 2);
    ty += (view.top + view.height / 2) - (rect.top + rect.height / 2);
    apply();
  }

  Array.prototype.forEach.call(
    document.querySelectorAll("#bom tr"),
    function (row) {
      var cell = row.querySelector("td.bom_col_designators");
      if (!cell || !cell.textContent.trim()) return;
      var designators = cell.textContent.trim().split(/[,\s]+/);
      if (!nodesFor(designators).length) return;
      row.setAttribute("data-wv-linked", "");
      row.addEventListener("click", function () {
        var wasSelected = selectedRow === row;
        clearPartFocus();
        if (wasSelected) return;
        var members = nodesFor(designators);
        members.forEach(function (node) { node.classList.add("wv-hl"); });
        svg.classList.add("wv-focus-part");
        row.classList.add("wv-selected");
        selectedRow = row;
        centerOn(members[0]);
      });
    }
  );

  document.addEventListener("keydown", function (event) {
    if (event.key === "Escape") clearPartFocus();
  });
})();
</script>

</body></html>
